name: Subscription Usage Multi-Runtime

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: subscription-usage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: renewal-notice-tracker

jobs:
  node-and-schema:
    name: Node and schema gates
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: renewal-notice-tracker/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck generated database contracts
        run: npm run typecheck
      - name: Run subscription usage production gates
        run: npm run test:subscription-usage-production
      - name: Run complete Node test suite
        run: npm test
      - name: Validate paid design-partner reports and beta gates
        run: npm run test:paid-design-partner-beta
      - name: Run trust and permission gates
        run: npm run test:permission-boundaries
      - name: Run migration and deployment static checks
        run: npm run test:deployment-readiness
      - name: Build production application
        run: npm run build
        env:
          NOTICECONTROL_CONFIG_VALIDATION_MODE: ci_build
          NEXT_PUBLIC_APP_URL: https://ci.noticecontrol.invalid
          NEXT_PUBLIC_SUPABASE_URL: https://ci-supabase.noticecontrol.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: not-a-secret-ci-anon-placeholder-000000000000
          SUPABASE_SERVICE_ROLE_KEY: not-a-secret-ci-service-placeholder-000000000
          SUPABASE_STORAGE_BUCKET: ci-contract-files
          SUPABASE_EXPORTS_BUCKET: ci-export-artifacts
          OPENAI_API_KEY: not-a-secret-ci-openai-placeholder-0000000000
          OCR_PROVIDER: mock
          RESEND_API_KEY: not-a-secret-ci-resend-placeholder-0000000000
          RESEND_FROM_EMAIL: ci@noticecontrol.invalid
          RESEND_WEBHOOK_SIGNING_SECRET: not-a-secret-ci-resend-webhook-placeholder-0000
          NOTICECONTROL_EMAIL_ACTION_SECRET: not-a-secret-ci-email-action-placeholder-00000
          CRON_SHARED_SECRET: not-a-secret-ci-cron-placeholder-000000000000
          INTERNAL_HEALTH_SECRET: not-a-secret-ci-health-placeholder-0000000000
          INTERNAL_OCR_JOBS_SECRET: not-a-secret-ci-ocr-placeholder-000000000000
          INTERNAL_OPERATIONS_SECRET: not-a-secret-ci-ops-placeholder-000000000000
          INTERNAL_DESTRUCTIVE_OPS_SECRET: not-a-secret-ci-destructive-placeholder-000000
          INTERNAL_DESTRUCTIVE_OPS_SIGNING_SECRET: not-a-secret-ci-destructive-signing-placeholder
          PADDLE_ENVIRONMENT: production
          PADDLE_API_KEY: not-a-secret-ci-paddle-placeholder-0000000000
          PADDLE_WEBHOOK_SECRET: not-a-secret-ci-paddle-webhook-placeholder-0000
          PADDLE_STARTER_PRICE_ID: pri_ci_starter
          PADDLE_GROWTH_PRICE_ID: pri_ci_growth

  python:
    name: Python reconciliation tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: renewal-notice-tracker/services/python-intelligence/pyproject.toml
      - name: Install Python dependencies
        working-directory: renewal-notice-tracker/services/python-intelligence
        run: python -m pip install -e ".[test]"
      - name: Run Python tests
        working-directory: renewal-notice-tracker/services/python-intelligence
        run: python -m pytest tests

  java:
    name: Java connector tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: renewal-notice-tracker/services/java-enterprise-connectors/pom.xml
      - name: Run Java connector tests
        working-directory: renewal-notice-tracker/services/java-enterprise-connectors
        run: mvn --batch-mode test

  database-integration:
    name: Disposable Supabase database integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: renewal-notice-tracker/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Start isolated Supabase stack
        run: npx --yes supabase@2.39.2 start
      - name: Run migration and RPC integration tests
        run: npm run test:db:subscription-usage
      - name: Stop isolated Supabase stack
        if: always()
        run: npx --yes supabase@2.39.2 stop --no-backup

  fixture-smoke:
    name: Subscription usage fixture smoke
    needs: database-integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: renewal-notice-tracker/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Validate callback, scheduler, and review fixtures after database disconnect smoke
        run: npm run test:subscription-usage-smoke

  release-gate:
    name: Paid design-partner release gate
    if: always()
    needs:
      - node-and-schema
      - python
      - java
      - database-integration
      - fixture-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Require every readiness job to pass
        env:
          NODE_RESULT: ${{ needs.node-and-schema.result }}
          PYTHON_RESULT: ${{ needs.python.result }}
          JAVA_RESULT: ${{ needs.java.result }}
          DATABASE_RESULT: ${{ needs.database-integration.result }}
          FIXTURE_RESULT: ${{ needs.fixture-smoke.result }}
        run: |
          test "$NODE_RESULT" = "success"
          test "$PYTHON_RESULT" = "success"
          test "$JAVA_RESULT" = "success"
          test "$DATABASE_RESULT" = "success"
          test "$FIXTURE_RESULT" = "success"
