name: Node CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: node-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: renewal-notice-tracker

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: renewal-notice-tracker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run TypeScript checks
        run: npm run typecheck

      - name: Run complete test suite
        run: npm run test

      - name: Run subscription usage production gate
        run: npm run test:subscription-usage-production

      - name: Run trust-sensitive permission and control-plane gate
        run: npm run test:trust-sensitive

      - name: Run billing control-plane gate
        run: npm run test:billing-control-plane

      - name: Run permission-boundary gate
        run: npm run test:permission-boundaries

      - name: Run intelligence release gate
        run: npm run test:intelligence-release-gate

      - name: Run data-integrity and review-reminder gate
        run: npm run test:data-integrity

      - name: Build production application
        run: npm run build
        env:
          NOTICECONTROL_CONFIG_VALIDATION_MODE: ci_build
          NEXT_PUBLIC_APP_URL: https://ci.noticecontrol.invalid
          NEXT_PUBLIC_SUPABASE_URL: https://ci-supabase.noticecontrol.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: not-a-secret-ci-anon-placeholder-000000000000
          SUPABASE_SERVICE_ROLE_KEY: not-a-secret-ci-service-placeholder-000000000
          SUPABASE_STORAGE_BUCKET: ci-contract-files
          SUPABASE_EXPORTS_BUCKET: ci-export-artifacts
          OPENAI_API_KEY: not-a-secret-ci-openai-placeholder-0000000000
          OCR_PROVIDER: mock
          RESEND_API_KEY: not-a-secret-ci-resend-placeholder-0000000000
          RESEND_FROM_EMAIL: ci@noticecontrol.invalid
          RESEND_WEBHOOK_SIGNING_SECRET: not-a-secret-ci-resend-webhook-placeholder-0000
          NOTICECONTROL_EMAIL_ACTION_SECRET: not-a-secret-ci-email-action-placeholder-00000
          CRON_SHARED_SECRET: not-a-secret-ci-cron-placeholder-000000000000
          INTERNAL_HEALTH_SECRET: not-a-secret-ci-health-placeholder-0000000000
          INTERNAL_OCR_JOBS_SECRET: not-a-secret-ci-ocr-placeholder-000000000000
          INTERNAL_OPERATIONS_SECRET: not-a-secret-ci-ops-placeholder-000000000000
          INTERNAL_DESTRUCTIVE_OPS_SECRET: not-a-secret-ci-destructive-placeholder-000000
          INTERNAL_DESTRUCTIVE_OPS_SIGNING_SECRET: not-a-secret-ci-destructive-signing-placeholder
          PADDLE_ENVIRONMENT: production
          PADDLE_API_KEY: not-a-secret-ci-paddle-placeholder-0000000000
          PADDLE_WEBHOOK_SECRET: not-a-secret-ci-paddle-webhook-placeholder-0000
          PADDLE_STARTER_PRICE_ID: pri_ci_starter
          PADDLE_GROWTH_PRICE_ID: pri_ci_growth

      - name: Run internal-operations readiness gate
        run: npm run test:ops-readiness
