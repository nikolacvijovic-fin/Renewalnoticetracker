name: Node CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: node-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: renewal-notice-tracker

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: renewal-notice-tracker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run TypeScript checks
        run: npm run typecheck

      - name: Run complete test suite
        run: npm run test

      - name: Run trust-sensitive permission and control-plane gate
        run: npm run test:trust-sensitive

      - name: Run billing control-plane gate
        run: npm run test:billing-control-plane

      - name: Run permission-boundary gate
        run: npm run test:permission-boundaries

      - name: Run data-integrity and review-reminder gate
        run: npm run test:data-integrity

      - name: Run internal-operations readiness gate
        run: npm run test:ops-readiness
