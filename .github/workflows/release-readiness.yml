name: Release Readiness

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: Release target environment
        required: true
        type: choice
        options:
          - staging
          - production

      smoke_owner:
        description: Named owner for smoke verification
        required: true
        type: string

      rollback_owner:
        description: Named owner for rollback decision
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-readiness-${{ inputs.target_environment }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: renewal-notice-tracker

jobs:
  release-readiness:
    name: Release Readiness
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: ${{ inputs.target_environment }}

    env:
      RELEASE_TARGET_ENV: ${{ inputs.target_environment }}
      RELEASE_SMOKE_OWNER: ${{ inputs.smoke_owner }}
      RELEASE_ROLLBACK_OWNER: ${{ inputs.rollback_owner }}
      RESEND_FROM_EMAIL: ${{ vars.RESEND_FROM_EMAIL }}
      NOTICECONTROL_SENDING_DOMAIN: ${{ vars.NOTICECONTROL_SENDING_DOMAIN }}
      NOTICECONTROL_REPLY_TO_EMAIL: ${{ vars.NOTICECONTROL_REPLY_TO_EMAIL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: renewal-notice-tracker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run strict release gate
        run: npm run release:strict
        env:
          RESEND_WEBHOOK_SIGNING_SECRET: ${{ secrets.RESEND_WEBHOOK_SIGNING_SECRET }}
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_AUTH_COOKIE_NAME: ${{ secrets.E2E_AUTH_COOKIE_NAME }}
          E2E_AUTH_COOKIE_VALUE: ${{ secrets.E2E_AUTH_COOKIE_VALUE }}
          E2E_SECONDARY_AUTH_COOKIE_VALUE: ${{ secrets.E2E_SECONDARY_AUTH_COOKIE_VALUE }}
          E2E_MEMBER_AUTH_COOKIE_VALUE: ${{ secrets.E2E_MEMBER_AUTH_COOKIE_VALUE }}
          E2E_REVIEW_CONTRACT_PATH: ${{ secrets.E2E_REVIEW_CONTRACT_PATH }}
          E2E_FOREIGN_CONTRACT_PATH: ${{ secrets.E2E_FOREIGN_CONTRACT_PATH }}

      - name: Run intelligence release gate
        run: npm run test:intelligence-release-gate

      - name: Run target-environment smoke test
        run: npm run smoke:staging
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_AUTH_COOKIE_NAME: ${{ secrets.E2E_AUTH_COOKIE_NAME }}
          E2E_AUTH_COOKIE_VALUE: ${{ secrets.E2E_AUTH_COOKIE_VALUE }}
          E2E_SECONDARY_AUTH_COOKIE_VALUE: ${{ secrets.E2E_SECONDARY_AUTH_COOKIE_VALUE }}
          E2E_MEMBER_AUTH_COOKIE_VALUE: ${{ secrets.E2E_MEMBER_AUTH_COOKIE_VALUE }}
          E2E_REVIEW_CONTRACT_PATH: ${{ secrets.E2E_REVIEW_CONTRACT_PATH }}
          E2E_FOREIGN_CONTRACT_PATH: ${{ secrets.E2E_FOREIGN_CONTRACT_PATH }}
