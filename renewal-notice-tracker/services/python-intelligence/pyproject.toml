[project]
name = "noticecontrol-python-intelligence"
version = "0.1.0"
description = "Scaffolded intelligence add-on for NoticeControl contract extraction and reconciliation workflows."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "pydantic>=2.8.0",
  "uvicorn>=0.30.0"
]

[project.optional-dependencies]
test = ["pytest>=8.0.0", "httpx>=0.27.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
