name: noticecontrol-production

x-app-service: &app-service
  build:
    context: .
    target: app-runtime
  image: noticecontrol-app:${NOTICECONTROL_IMAGE_TAG:-local}
  env_file:
    - .env.production
  restart: unless-stopped
  init: true

services:
  web:
    <<: *app-service
    environment:
      NODE_ENV: production
      NOTICECONTROL_ENV: production
      NOTICECONTROL_APP_URL: http://web:3000
    ports:
      - "${NOTICECONTROL_HTTP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "scripts/check-runtime-health.mjs", "web"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  pdf-worker:
    <<: *app-service
    command: ["npm", "run", "worker:pdf"]
    environment:
      NODE_ENV: production
      NOTICECONTROL_ENV: production
      PDF_WORKER_HEARTBEAT_FILE: /tmp/noticecontrol-pdf-worker.heartbeat
      RUNTIME_HEARTBEAT_FILE: /tmp/noticecontrol-pdf-worker.heartbeat
      RUNTIME_HEARTBEAT_MAX_AGE_SECONDS: "600"
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "scripts/check-runtime-health.mjs", "heartbeat"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  maintenance-scheduler:
    <<: *app-service
    command: ["npm", "run", "scheduler"]
    environment:
      NODE_ENV: production
      NOTICECONTROL_ENV: production
      NOTICECONTROL_APP_URL: http://web:3000
      SCHEDULER_HEARTBEAT_FILE: /tmp/noticecontrol-scheduler.heartbeat
      RUNTIME_HEARTBEAT_FILE: /tmp/noticecontrol-scheduler.heartbeat
      RUNTIME_HEARTBEAT_MAX_AGE_SECONDS: "600"
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "scripts/check-runtime-health.mjs", "heartbeat"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  reminder-worker:
    build:
      context: .
      target: go-worker-runtime
    image: noticecontrol-reminder-worker:${NOTICECONTROL_IMAGE_TAG:-local}
    env_file:
      - .env.production
    environment:
      NOTICECONTROL_WORKER_ENV: production
      NOTICECONTROL_APP_URL: http://web:3000
      NOTICECONTROL_WORKER_HEARTBEAT_FILE: /tmp/noticecontrol-reminder-worker.heartbeat
      NOTICECONTROL_WORKER_HEARTBEAT_MAX_AGE_SECONDS: "600"
    restart: unless-stopped
    init: true
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/noticecontrol-worker", "--health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
